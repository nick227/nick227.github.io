  <!-- Critical First Paint Minimum CSS -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      background: white;
      color: #050505;
      font-family: Outfit, Arial, sans-serif;
    }

    .section-header {
      position: fixed;
      z-index: 100;
      top: 20px;
      right: clamp(28px, 4vw, 72px);
      left: clamp(28px, 4vw, 72px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 33%;
    }

    .site-branding,
    .site-navigation a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      color: inherit;
      font: inherit;
      text-decoration: none;
    }

    .site-navigation {
      display: flex;
      align-items: center;
      gap: clamp(25px, 3.7vw, 43px);
    }

    .column {
      width: min(640px, calc(100% - 2 * clamp(28px, 4vw, 72px)));
      margin-inline: auto;
      padding: 100px 0 0;
    }

    .media-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #f2f2f2;
    }

    .media-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
    }

    .media-frame.is-ready iframe {
      opacity: 1;
      transition: opacity 160ms ease;
    }

    .boot {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .media-frame.is-ready .boot {
      display: none;
    }

    .boot::before {
      width: 16px;
      height: 16px;
      border: 2px solid #e4e4e4;
      border-top-color: #8a8a8a;
      border-radius: 50%;
      content: "";
      animation: boot-spin 0.7s linear infinite;
    }

    @keyframes boot-spin {
      to { transform: rotate(1turn); }
    }

    @media (max-width: 800px) {
      .section-header,
      .column {
        position: relative;
        top: 0;
        right: 0;
        left: 0;
        width: 100%;
        margin-inline: auto;
        padding: 0 20px;
      }

      .column {
        padding-top: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot::before { animation: none; }
      .media-frame.is-ready iframe { transition: none; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
